# Local development only. DATABASE_URL is explicitly local: this cannot migrate Neon.
x-app-environment: &app-environment
  APP_ENV: development
  DATABASE_URL: postgres://app:local-development-only@db:5432/enterprise?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
  JWT_ISSUER: enterprise-rust-backend
  JWT_AUDIENCE: enterprise-api
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  RUST_LOG: info,sqlx=warn

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: enterprise
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d enterprise"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["migrate"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      <<: *app-environment
      HTTP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  postgres_data:
